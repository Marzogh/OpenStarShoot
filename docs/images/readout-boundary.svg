<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="630px" version="1.1" viewBox="0 0 1440 630" width="1440px"><metadata>Author: Prajwal Bhattaram; OpenStarShoot technical figures.</metadata><defs/><title>OpenStarShoot: nine-pixel zero run at an application read boundary</title><desc>A transfer-level diagram showing ten trailing zero bytes in one 1024-byte libusb application read and eight leading zero bytes in the next, forming nine 16-bit zero-valued image pixels. The same relation was seen with 512-byte read requests.</desc><rect fill="#FFFFFF" height="630" width="1440" x="0" y="0"/><text fill="#2B5368" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.3px" text-anchor="start" x="74" y="59">INTERMITTENT RAW-IMAGE ARTEFACT</text><text fill="#5C7077" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="600" text-anchor="end" x="1365" y="59">OBSERVED IN APPLICATION READ BUFFERS</text><line stroke="#CBD7DC" stroke-width="1.2" x1="74" x2="1366" y1="84" y2="84"/><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="49" font-weight="600" text-anchor="start" x="74" y="164">9 zero-valued pixels</text><text fill="#5C7077" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" x="74" y="207">18 consecutive bytes across one read boundary</text><rect fill="#E7EFF2" height="116" rx="0" width="640" x="74" y="290"/><rect fill="#E7EFF2" height="116" rx="0" width="652" x="714" y="290"/><rect fill="#F7E2BF" height="116" rx="0" width="116" x="598" y="290"/><rect fill="#F7E2BF" height="116" rx="0" width="96" x="714" y="290"/><line stroke="#2B5368" stroke-width="3" x1="714" x2="714" y1="270" y2="416"/><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" x="260" y="334">READ N</text><text fill="#5C7077" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="500" text-anchor="middle" x="260" y="368">1024 bytes</text><text fill="#19303A" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="29" font-weight="700" text-anchor="middle" x="656.0" y="337">10</text><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle" x="656.0" y="367">bytes</text><text fill="#19303A" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="29" font-weight="700" text-anchor="middle" x="762.0" y="337">8</text><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle" x="762.0" y="367">bytes</text><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" x="1070" y="334">READ N + 1</text><text fill="#5C7077" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="500" text-anchor="middle" x="1070" y="368">1024 bytes</text><line stroke="#DD963D" stroke-width="2" x1="598" x2="598" y1="274" y2="252"/><line stroke="#DD963D" stroke-width="2" x1="810" x2="810" y1="274" y2="252"/><line stroke="#DD963D" stroke-width="2" x1="598" x2="810" y1="252" y2="252"/><text fill="#19303A" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="600" text-anchor="middle" x="704" y="235">10 + 8</text><text fill="#2B5368" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" x="714" y="447">Application read boundary</text><text fill="#5C7077" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="714" y="476">Highlighted byte spans enlarged for readability</text><line stroke="#CBD7DC" stroke-width="1.2" x1="74" x2="1366" y1="525" y2="525"/><text fill="#2B5368" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2px" text-anchor="start" x="74" y="568">512-BYTE REQUESTS</text><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="74" y="602">The same nine-pixel run shifted to the new read boundaries.</text></svg>