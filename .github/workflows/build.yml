name: Native builds and offline regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            os: ubuntu-24.04
          - platform: macOS arm64
            os: macos-15
          - platform: Windows x64 MSVC
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install offline FITS test dependencies
        run: python -m pip install numpy astropy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libindi-dev libcfitsio-dev
      - name: Install macOS USB dependency and verify architecture
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install libusb
      - name: Install Windows USB dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libusb:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
          "$env:RUNNER_TEMP/install/bin" >> $env:GITHUB_PATH
      - name: Run existing Linux Makefile and INDI regressions
        if: runner.os == 'Linux'
        run: |
          make BUILD="$RUNNER_TEMP/linux-make" PYTHON="$(command -v python)" all check check-fits check-roi indi check-indi
      - name: Configure native build
        run: |
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            extra=(-A x64 "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows)
          elif [[ "$RUNNER_OS" == macOS ]]; then
            extra=(-DCMAKE_OSX_ARCHITECTURES=arm64)
          fi
          cmake -S . -B "$RUNNER_TEMP/native" -DCMAKE_BUILD_TYPE=Release \
            "-DPython3_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')" \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/install" "${extra[@]}"
      - name: Build static/shared libraries, CLI and offline tests
        run: cmake --build "$RUNNER_TEMP/native" --config Release --parallel 3
      - name: Run native offline regressions
        run: ctest --test-dir "$RUNNER_TEMP/native" -C Release --output-on-failure
      - name: Verify macOS output architecture
        if: runner.os == 'macOS'
        run: |
          lipo "$RUNNER_TEMP/native/libopenstarshoot.dylib" -verify_arch arm64
          lipo "$RUNNER_TEMP/native/starshoot-diag" -verify_arch arm64
      - name: Install native library and tools
        run: cmake --install "$RUNNER_TEMP/native" --config Release
      - name: Build and test installed-library consumers
        run: |
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            extra=(-A x64 "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows)
          elif [[ "$RUNNER_OS" == macOS ]]; then
            extra=(-DCMAKE_OSX_ARCHITECTURES=arm64)
          fi
          cmake -S tests/installed -B "$RUNNER_TEMP/consumer" \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/install" "${extra[@]}"
          cmake --build "$RUNNER_TEMP/consumer" --config Release
          ctest --test-dir "$RUNNER_TEMP/consumer" -C Release --output-on-failure
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native/Testing/Temporary/
            ${{ runner.temp }}/consumer/Testing/Temporary/
          if-no-files-found: ignore
